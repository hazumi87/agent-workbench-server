<html lang="en">
<head>

  <meta charset="utf-8" />
  <!-- No `maximum-scale` / `user-scalable=no` (see web/solo.html): with iOS
       Display Zoom they lay the page out wider than the glass. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0C1014" />
  <title>Settings</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- GLOBAL SETTINGS (Owner 2026-09-28): what belongs to the PERSON across
       every room lives here, not in each room's ⚙ column. Groups owned by other
       modules are MOUNTED (the contract is at the top of web/settings.mjs). The
       look is the room ⚙ column's (pv-* groups), not a new one. -->
  <link rel="stylesheet" href="/vendor/aurora-tokens.css" />
  <link rel="stylesheet" href="/settings.css" />
  <link rel="stylesheet" href="/edition.css" />
  <link rel="stylesheet" href="/light-mode.css" />
</head>
<body>
  <header class="st-top">
    <h1 class="st-name">Settings</h1>
    <a class="pv-btn st-back" id="backLink" href="/manager.html">← Manager</a>
  </header>
  <!-- SECTION MENU (hub V2, Owner 2026-10-05): web/settings.mjs fills the nav from GROUPS -->
  <main class="st-main v2nav">
    <nav class="st-nav" id="nav" aria-label="Settings sections"></nav>
    <div class="st-col">
      <p class="pv-msg" id="status" role="status">Loading…</p>
      <div class="pv-set" id="groups"></div>
    </div>
  </main>
  <script type="module" src="/settings.mjs"></script>
</body>
</html>
