    if (c.dataset.tab === id) { return; }
    const cr = c.getBoundingClientRect();
    if (px > cr.left + cr.width / 2) { k++; }
  });
  if (k === cur) { return; }
  const moved = order.splice(cur, 1)[0];
  order.splice(k, 0, moved);
  tabs.length = 0;
  if (hub) { tabs.push(hub); }
  order.forEach(function (t) { tabs.push(t); });
  renderTabs();
  postTabsState();
}

/* ==== LINKS OUT OF A TAB (open-external.mjs, the cli-manager host contract):
   a tab's page posts {hwbOpenExternal: url}; the host's WebView2 listens on
   THIS top-level document only, so the shell passes it on (the system
   browser in the host, a new window in a plain browser). Relayed only from a
   frame the shell made itself — a tab's iframe, or a room's member frame at
   level 2 — never from a frame nested deeper (a panel app inside a tab). */
relayExternal(function (src) {
  return tabs.some(function (t) {
    if (t.iframe && t.iframe.contentWindow === src) { return true; }
    return !!t.memberFrames && Array.from(t.memberFrames.values()).some(function (f) { return f.contentWindow === src; });
  });
});

/* ==== engine-facing hook ([ref] delivery surface into the window layer):
   a child iframe posts {hwbState:'waiting'|..., title?} to window.parent —
   match e.source to the tab's iframe, update chip + aggregate. */
/* [concierge] whether the status menu offers it: off, no recipe, or Basic = no item */
let cgShown = false;
import('/concierge.mjs').then(function (m) {
  return m.refresh().then(function (st) { cgShown = m.shown(st); });
}).catch(function () { cgShown = false; });

window.addEventListener('message', function (e) {
  const d = e.data;
  if (!d || typeof d !== 'object') { return; }
  const t = tabs.find(function (x) { return x.iframe && x.iframe.contentWindow === e.source; });
  if (!t) { return; }

  /* --- close handshake (engine contract §4, settled 2026-08-07) --- */
  if (d.hwbCloseAck === true) {
    ackClose(t);
    return;
  }
  if (typeof d.hwbCloseResult === 'string') {
    ackClose(t);                       // a result implies the ack
    resolveClose(t, d.hwbCloseResult);
    return;
  }

  /* --- a WORKROOM page says which room cycle it offers [ticket]: its ✕
     offers "Disconnect agents" only while `disconnect` is in the list. */
  if (Array.isArray(d.hwbRoomActions)) {
    if (isWorkroom(t)) {
      t.roomActions = d.hwbRoomActions.filter(function (a) { return a === 'disconnect' || a === 'reconnect'; });
    }
    return;
  }

  /* --- a WORKROOM page hands over its seats for level 2 (item 3): order is
     the room's (lead first), states are per MEMBER (A4: never an aggregate). */
  if (d.hwbRoomModel !== undefined) {
    if (isWorkroom(t)) {
      const mm = d.hwbRoomModel && Array.isArray(d.hwbRoomModel.members) ? d.hwbRoomModel.members : [];
      t.roomModel = {
        members: mm.filter(function (m) { return m && typeof m.seatId === 'string' && typeof m.handle === 'string'; })
          .map(function (m) {
            return {
              seatId: m.seatId, handle: m.handle,
              url: typeof m.url === 'string' && m.url.indexOf('/solo.html?') === 0 ? m.url : null,
              state: typeof m.state === 'string' ? m.state : 'ended',
              exit: m.exit === 'ok' || m.exit === 'fail' ? m.exit : null,
              brand: typeof m.brand === 'string' ? m.brand : 'generic',
              brandColor: typeof m.brandColor === 'string' ? m.brandColor : null,
              base: typeof m.base === 'string' ? m.base : null,
              logoKey: typeof m.logoKey === 'string' ? m.logoKey : null,
              mark: typeof m.mark === 'string' ? m.mark : null,
              markStyle: markStyleOf(m.markStyle), // v32 [rooms/character]
              primary: !!m.primary,
            };
          }),
      };
      if (roomView && roomView.tabId === t.id) { renderTabs(); }
    }
    return;
  }

  /* --- a WORKROOM page hands over its own Dark/Light override [window-chrome v34]
     (Owner approved 2026-10-05). null/absent = follow the shell. In memory only,
     like the identity: the room page re-sends it on load. --- */
  if (d.hwbRoomMode !== undefined) {
    if (isWorkroom(t)) {
      t.roomMode = d.hwbRoomMode === 'light' || d.hwbRoomMode === 'dark' ? d.hwbRoomMode : null;
      renderTabs();
    }
    return;
  }

  /* --- a WORKROOM page hands over its lead's identity (item 3). null = no
     lead = a neutral tab. In memory only: the room page re-sends it on load,
     so a restored tab heals on its own. Other tabs ignore it. --- */
  if (d.hwbRoomIdentity !== undefined) {
    if (isWorkroom(t)) {
      const r = d.hwbRoomIdentity;
      t.roomIdentity = (r && typeof r === 'object') ? {
        base: typeof r.base === 'string' && r.base ? r.base : null,
        logoKey: typeof r.logoKey === 'string' && r.logoKey ? r.logoKey : null,
        mark: typeof r.mark === 'string' && r.mark ? r.mark : null,
        markStyle: markStyleOf(r.markStyle), // v32 [rooms/character]
      } : null;
      log('room identity: ' + t.id + ' ' + (!t.roomIdentity ? 'none (no lead)'
        : t.roomIdentity.logoKey || (t.roomIdentity.mark ? 'custom mark' : 'colour only')));
      renderTabs();
    }
    return;
  }

  /* --- ASSEMBLE ROOM (the design notes §3.1): the Manager asks which
     SESSION tabs this window holds, to pre-check them in its modal. Answered
     to the asking frame only. */
  if (d.hwbTabsRequest === true) {
    try { e.source.postMessage({ hwbTabs: windowTabsState() }, '*'); } catch (err) { /* frame gone */ }
    return;
  }

  /* --- any page may ask for Settings (a room's "Needs approval ›", a
     panel's {panel:'open-settings'}) [ticket]: the one Settings tab --- */
  if (d.hwbOpenSettings !== undefined) {
    openSettingsTab(d.hwbOpenSettings && typeof d.hwbOpenSettings === 'object' ? d.hwbOpenSettings.section : null);
    return;
  }

  /* --- hub verbs an embedded page may use (CLI Manager duties) --- */
  if (d.hwbSessionId !== undefined) {
    t.sessionId = (typeof d.hwbSessionId === 'string' && d.hwbSessionId) ? d.hwbSessionId : null;
    log('session id: ' + t.id + ' = ' + t.sessionId);
    /* a page that names itself the manager becomes the hub chip, gets pinned
       first and drops whatever identity it was provisionally handed */
    if (isHub(t)) {
      t.base = NEUTRAL_BASE;
      if (tabs[0] !== t) {
        tabs.splice(tabs.indexOf(t), 1);
        tabs.unshift(t);
      }
    }
    renderTabs();
    postTabsState();
    return;
  }
  if (d.hwbBadge !== undefined) {
    badge = (typeof d.hwbBadge === 'number' && isFinite(d.hwbBadge)) ? d.hwbBadge : null;
    log('badge: ' + badge + ' (from ' + t.id + ') — hub live-session INVENTORY, '
      + 'not the coral blocked count');
    renderTabs();
    postTabsState();
    return;
  }
  /* hub asks for a session to open AS A TAB here (vs a new OS window, which
     the engine gets from the control API) */
  if (d.hwbOpenTab && typeof d.hwbOpenTab.url === 'string') {
    const o = d.hwbOpenTab;
    /* the same SESSION already open here is focused, never framed twice (a
       second frame is a viewer stuck behind the control prompt) — matched by
       the announced sessionId OR by the pane its solo url names */
    const wantPane = paneidFromTabUrl(o.url);
    const existing = (o.sessionId && tabs.find(function (x) { return x.sessionId === o.sessionId; }))
      || (wantPane && tabs.find(function (x) { return paneidFromTabUrl(x.url) === wantPane; }));
    if (existing) {
      activate(existing.id);
      log('open tab: session already here -> focused ' + existing.id);
    } else {
      const nt = addTab(o.url, o.title || null, true, o.state || null, o.sessionId || null,
        o.base || null, o.logoKey || null);
      log('open tab: ' + nt.id + ' ' + o.url);
    }
    return;
  }

  /* v2 identity, optional: a page may name its own base colour and project
     mark. Everything derives from the base in CSS — we persist the hex/var and
     the preset KEY, never a computed ramp and never the SVG. */
  let identityChanged = false;
  /* v21 session-bar data (project, title, brand, counts) — see the tab model
     note: in memory only, never mirrored or persisted. */
  /* --- MCP-call indicator: the bar is OURS, one per window, showing the
     ACTIVE tab's calls. Each tab keeps its in-flight starts so a switch back
     re-shows a long call (web/mcp-bar.mjs). --- */
  if (d.hwbMcp && typeof d.hwbMcp === 'object') {
    t.mcp = t.mcp || new Map();
    trackInFlight(t.mcp, d.hwbMcp);
    if (t.id === activeId && mcpTab === t.id) { mcpView.event(d.hwbMcp); }
    return;
  }
  if (Array.isArray(d.hwbMcpReset)) {
    t.mcp = new Map();
    d.hwbMcpReset.forEach(function (e) { trackInFlight(t.mcp, e); });
    if (t.id === activeId && mcpTab === t.id) { mcpView.reset([...t.mcp.values()]); }
    return;
  }
  if (d.hwbBar && typeof d.hwbBar === 'object') {
    t.bar = d.hwbBar;
    identityChanged = true;
  }
  if (d.items && typeof d.items === 'object') {
    const n = Number(d.items.count);
    t.items = (Number.isFinite(n) && n > 0) ? { count: n } : null;
    identityChanged = true;
  }
  if (typeof d.hwbBase === 'string' && d.hwbBase) {
    t.base = d.hwbBase;
    identityChanged = true;
  }
  if (d.hwbLogo !== undefined) {
    /* Keep UNKNOWN keys — the preset set is OPEN-ENDED (Owner loads new ones
       into the engine's vendor module) and the renderer resolves from the
       merged map, engine's superset included. Validating against the bundle's
       5-key subset here is what silently ate engine logos (found by Owner:
       every tab wore the fallback palette while the page watermark was right). */
    t.logoKey = (typeof d.hwbLogo === 'string' && d.hwbLogo) ? d.hwbLogo : null;
    identityChanged = true;
  }

  if (typeof d.hwbState !== 'string') {
    if (identityChanged) {
      log('identity: ' + t.id + ' base=' + t.base + ' logo=' + t.logoKey);
      renderTabs();
      postTabsState();
    }
    return;
  }
  const mapped = ENGINE_TO_CHROME[d.hwbState] || d.hwbState;
  if (STATES.indexOf(mapped) >= 0 || (isWorkroom(t) && tabStateOk(mapped))) {
    t.state = mapped;
  } else {
    log('engine: UNKNOWN state "' + d.hwbState + '" from ' + t.id + ' — kept ' + t.state);
  }
  /* ended verdict: engine sends {hwbState:'ended', exit:'ok'|'fail'} — the seam
     wears the verdict. Window-level setExit reflects the ACTIVE tab. */
  if (d.hwbState === 'ended' && (d.exit === 'ok' || d.exit === 'fail')) {
    t.exit = d.exit;
  }
  if (typeof d.title === 'string' && d.title) {
    t.title = d.title;
    t.iframe.title = d.title;
  }
  log('engine: ' + t.id + ' hwbState=' + d.hwbState + (d.exit ? ' exit=' + d.exit : '')
    + (d.title ? ' title="' + d.title + '"' : ''));
  renderTabs();
  postTabsState();
});

/* ==== v21 bundle events -> existing paths =================================
   The v21 chrome dispatches these as CustomEvents from inside the window
   element. We listen on DOCUMENT: a bubbling event from anywhere in #win
   reaches it, and so does one the bundle chooses to fire on document itself,
   so neither choice upstream breaks us. Routing rules live in
   routeBundleEvent (shell-tabs.mjs, unit-tested).

   close-view = closeTab: the SAME close the caption ✕ and middle-click use —
     the page is asked, answers `park` at once (no dialog any more, 2026-09-12)
     and the tab goes. Going through the page matters: `park` pins the session
     against the detach reaper, so "close the view, keep the session" holds for
     longer than the reaper window. A page that does not speak the protocol
     (the Manager) is closed locally after the 1.5s ack guard. Closing a view
     never kills (sessions live in the broker).
   end-session = the CLI Manager's "End": POST /api/sessions/<paneid>/end, no
     second confirm (the bundle showed one). The tab then goes too - a tab of
     a session you just ended has nothing left to show.
   refresh = the per-tab reload (same as F5 / the strip button). */
const bundleHandlers = {
  closeView: function (id, reason) {
    if (roomView && typeof id === 'string' && id.indexOf('m:') === 0) { closeMember(id); return; }
    if (roomView && id === 'chat') { leaveRoom(); return; }
    if (!tabs.some(function (t) { return t.id === id; })) { return; }
    log('hwb:close-view ' + id + (reason ? ' (' + reason + ')' : '') + ' — closing the tab, session kept');
    closeTab(id);
  },
  endSession: function (id) {
    if (roomView && typeof id === 'string' && id.indexOf('m:') === 0) {
      const m = memberOf(roomTab(), id.slice(2));
      const pane = m && m.url ? paneidFromTabUrl(m.url) : null;
      if (!pane) { return; }
      fetch('/api/sessions/' + encodeURIComponent(pane) + '/end', { method: 'POST' })
        .then(function (r) { log('hwb:end-session ' + id + ' -> ' + pane + ' HTTP ' + r.status); if (r.ok) { closeMember(id); } })
        .catch(function (err) { log('hwb:end-session ' + id + ' failed: ' + err); });
      return;
    }
    const t = tabs.find(function (x) { return x.id === id; });
    const paneid = t ? paneidFromTabUrl(t.url) : null;
    if (!paneid) {
      log('hwb:end-session ' + id + ' — not a session tab, ignored');
      return;
    }
    fetch('/api/sessions/' + encodeURIComponent(paneid) + '/end', { method: 'POST' })
      .then(function (r) {
        log('hwb:end-session ' + id + ' -> ' + paneid + ' HTTP ' + r.status);
        if (r.ok) { finishClose(id); }
      })
      .catch(function (err) { log('hwb:end-session ' + id + ' failed: ' + err); });
  },
  refresh: function (id) { refreshTab(id, 'hwb:refresh'); },
};
BUNDLE_EVENTS.forEach(function (type) {
  document.addEventListener(type, function (e) {
    routeBundleEvent(type, e.detail, bundleHandlers);
  });
});

/* ==== initial tabs ======================================================= */
const rawTabs = rawParam('tabs');
const initUrls = rawTabs
  ? rawTabs.split(',').filter(Boolean).map(function (s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    })
  : null;
/* THE URL IS A MEMBER OF THE SET, NOT THE WHOLE OF IT.
 *
 * A shell URL carries exactly one tab (desktop-actions.shellUrl builds
 * `?tabs=<one page>`), so rebuilding from it after a reload is what emptied
 * Owner's window. If this browsing context has a set written down, THAT is the
 * window — and any `?tabs=` member it does not already contain is appended, so
 * a host that navigates an existing shell to a new page still gets it.
 *
 * Tabs are added ABSOLUTE-MATCHED: addTab normalises with absUrl(), and the
 * stored urls were already absolute when they were written, so the set
 * comparison here is on the same strings both ways.
 *
 * URLs are stored VERBATIM, spent `ticket=` and all. A ticket is single-use and
 * was redeemed for a cookie on the first load; the cookie is what authenticates
 * the reload (this is already how F5 works today). Stripping it would be tidier
 * and would change the string identity a set match depends on, for no gain. */
const stored = readTabSet(window.sessionStorage);
const plan = planInitialTabs(stored, (initUrls || []).map(absUrl), location.href);
if (plan.tabs.length > 0) {
  plan.tabs.forEach(function (t, i) {
    addTab(t.url, t.title, i === plan.activeIndex, t.state, t.sessionId, t.base, t.logoKey);
  });
  log('tabs: ' + plan.tabs.length + ' from ' + plan.source
    + ' (active #' + plan.activeIndex + ')'
    + (plan.source === 'session' ? ' — RESTORED across a reload' : ''));
} else {
  addTab('/manager.html', 'Manager', true);
}

/* IS THIS WINDOW'S CHROME STILL THE ONE BEING SERVED? A shell fetches its
   chrome once and never again, so a window open across a deploy paints last
   week's glyphs with no error anywhere — the exact shape of the 2026-09-20
   "status icon shows nothing" hunt, where every layer was correct and the
   window was simply old. Detect it locally, mark it, and let the person choose
   the moment (the reload costs scrollback; see shell-update.mjs). */
watchForUpdate({
  onStale: function (served, mine) {
    updateReady = true;
    log('chrome update available: serving ' + served + ', this window loaded ' + mine);
    const act = root.querySelector('.hwb-act');
    if (act) {
      act.classList.add('has-update');
      act.title = 'A newer Workbench build is available — open this menu to reload';
    }
  },
});

window.addEventListener('load', function () {
  const errs = hwbAssertInvariants(root);
  log(errs.length ? '✗ invariants: ' + errs.join(' | ')
    : '✓ invariants hold (maxRect.x === W-92, drag reserve >= 154)');
});
</script>
</body>
